<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cờ Caro Gia Đình</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --ink: #2b2a4c;
    --x: #ff5a36;
    --o: #1e88ff;
    --sun: #ffd23f;
    --paper: rgba(255, 255, 255, 0.9);
    --line: #cfd3ea;
    --cell: #ffffff;
    --font: "Baloo 2", "Nunito", "Segoe UI", system-ui, sans-serif;
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #ffe9b8;
    color: var(--ink);
    font-family: var(--font);
    font-weight: 500;
    font-size: 16px;
    line-height: 1.3;
    padding-block: 8px 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  button, input { font-family: inherit; color: inherit; }
  :focus-visible { outline: 3px solid #7a3cff; outline-offset: 2px; }

  /* ---------- Backgrounds (6 themes) ---------- */
  #bg { position: fixed; top: 0; left: 0; right: 0; bottom: 0; overflow: hidden; z-index: 0; pointer-events: none; }
  [data-t="space"]   { background: radial-gradient(circle at 80% 10%, #ff7eb6 0, transparent 40%), linear-gradient(165deg, #1b1464, #4b2a9c 60%, #7a3cc8); }
  [data-t="ocean"]   { background: linear-gradient(180deg, #9af0ff 0%, #3aa6ee 45%, #0b4fa8 100%); }
  [data-t="dino"]    { background: linear-gradient(180deg, #d9f78a 0%, #62c47a 55%, #2b7a4b 100%); }
  [data-t="castle"]  { background: radial-gradient(circle at 20% 15%, #fff3fb 0, transparent 35%), linear-gradient(160deg, #ffc7e4, #ff9ccf 50%, #c88bff); }
  [data-t="rainbow"] { background: linear-gradient(180deg, #ffd6e0, #fff1c1 25%, #d4f5d0 50%, #cfe8ff 75%, #e3d4ff); }
  [data-t="racing"]  { background: linear-gradient(135deg, #ffb347, #ff7a45 45%, #2ab7f5); }
  .floater {
    position: absolute; opacity: 0.6; user-select: none;
    animation: drift 11s ease-in-out infinite alternate;
  }
  @keyframes drift {
    from { transform: translate(0, 0) rotate(-6deg); }
    to   { transform: translate(14px, -22px) rotate(8deg); }
  }

  #app { position: relative; z-index: 1; max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }

  /* ---------- Header ---------- */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .sticker {
    margin: 0; display: inline-flex; align-items: center; gap: 8px;
    background: var(--sun); border: 3px solid var(--ink); border-radius: 18px;
    padding: 2px 12px 2px 6px; box-shadow: 3px 3px 0 var(--ink);
    transform: rotate(-2deg);
    font-size: 22px; font-weight: 800; line-height: 1.05;
  }
  .sticker small { display: block; font-size: 12px; font-weight: 700; opacity: 0.75; }
  .sticker svg { width: 32px; height: 32px; flex: none; }
  .tools { display: flex; gap: 8px; }
  .btn {
    min-height: 40px; min-width: 40px; padding: 4px 14px;
    background: #fff; border: 3px solid var(--ink); border-radius: 14px;
    box-shadow: 0 3px 0 var(--ink); cursor: pointer;
    font-size: 16px; font-weight: 800;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    transition: transform 0.08s, box-shadow 0.08s;
  }
  .btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn.primary { background: var(--x); color: #fff; }
  .btn.blue { background: var(--o); color: #fff; }
  .btn.icon { padding: 2px; font-size: 20px; }
  a.btn { text-decoration: none; color: inherit; }

  .card {
    background: var(--paper); border: 3px solid var(--ink); border-radius: 18px;
    padding: 8px 10px; box-shadow: 0 3px 0 rgba(43, 42, 76, 0.5);
  }

  /* ---------- Theme picker ---------- */
  .theme-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .thumb {
    min-height: 64px; border: 3px solid var(--ink); border-radius: 14px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0;
    font-size: 13px; font-weight: 800; color: var(--ink); padding: 4px 2px; line-height: 1.1;
  }
  .thumb .em { font-size: 22px; letter-spacing: 2px; }
  .thumb .nm { background: rgba(255, 255, 255, 0.85); border-radius: 8px; padding: 0 6px; }
  .thumb[aria-pressed="true"] { outline: 4px solid #7a3cff; outline-offset: 2px; }
  @media (min-width: 480px) { .thumb { min-height: 76px; font-size: 14px; } }

  /* ---------- Settings ---------- */
  .settings { display: grid; gap: 4px; padding: 6px 8px; }
  .row { display: grid; grid-template-columns: 70px 1fr; align-items: center; gap: 6px; }
  .row > span { font-weight: 800; font-size: 13px; line-height: 1.1; }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 5px; }
  .seg button {
    min-height: 38px; border: 2px solid var(--ink); border-radius: 10px; background: #fff;
    font-size: 13.5px; font-weight: 800; cursor: pointer; line-height: 1.05; padding: 2px 4px;
  }
  .seg button small { display: block; font-size: 10px; font-weight: 600; opacity: 0.7; }
  .seg button[aria-pressed="true"] { background: var(--sun); box-shadow: inset 0 -3px 0 rgba(43, 42, 76, 0.25); }

  /* ---------- Players ---------- */
  .players { display: grid; grid-template-columns: 1fr 48px 1fr; gap: 6px; align-items: stretch; }
  .pcard {
    background: var(--paper); border: 2px solid var(--ink); border-radius: 14px; padding: 4px 8px;
    display: grid; grid-template-columns: 24px 1fr auto; grid-template-areas: "ic nm sc"; align-items: center; gap: 6px;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .pcard .ic { grid-area: ic; display: grid; }
  .pcard .ic svg { width: 24px; height: 24px; }
  .mark.dot { filter: drop-shadow(0 1.5px 1px rgba(0, 0, 0, 0.3)); }
  [data-pieces="dots"] .pcard.x.turn { box-shadow: 0 0 0 3px #ff4d4d; background: #fff0f0; }
  [data-pieces="dots"] .pcard.o.turn { box-shadow: 0 0 0 3px #22c55e; background: #eefbf2; }
  .seg .d { display: inline-block; width: 14px; height: 14px; border-radius: 50%; border: 2px solid #2b2a4c; vertical-align: -2px; margin-right: 2px; }
  .seg .d.r { background: #ff4d4d; } .seg .d.g { background: #22c55e; }
  #themes .row { margin-bottom: 8px; }
  .pcard .score { grid-area: sc; font-size: 24px; font-weight: 800; line-height: 1; }
  .pcard input {
    grid-area: nm; width: 100%; min-width: 0; min-height: 32px; border: 2px dashed var(--line); border-radius: 9px;
    background: #fff; padding: 0 6px; font-size: 16px; font-weight: 700;
  }
  @media (max-width: 479px) {
    .pcard { grid-template-columns: 24px 1fr; grid-template-areas: "ic sc" "nm nm"; gap: 2px 6px; }
    .pcard .score { justify-self: end; }
  }
  .pcard input:disabled { border-style: solid; background: #f1f2fa; }
  .pcard.x.turn { box-shadow: 0 0 0 3px var(--x); transform: translateY(-1px); background: #fff1ec; }
  .pcard.o.turn { box-shadow: 0 0 0 3px var(--o); transform: translateY(-1px); background: #eaf4ff; }
  .draws { text-align: center; display: grid; place-content: center; font-size: 11px; font-weight: 700; line-height: 1.05; }
  .draws b { font-size: 20px; font-weight: 800; display: block; }

  /* ---------- Board ---------- */
  .board-wrap {
    background: var(--paper); border-radius: 18px; padding: 8px;
    box-shadow: 0 0 0 3px var(--ink), 0 6px 0 3px rgba(43, 42, 76, 0.45);
    width: min(100%, 340px); margin: 0 auto;
  }
  /* 15x15: let the board use a little of the gutter so cells stay near 22px at 360px */
  .board-wrap.big {
    width: min(calc(100% + 16px), 600px); padding: 2px; border-radius: 10px;
    margin-left: 50%; transform: translateX(-50%);
  }
  .gridbox { position: relative; }
  #board { display: grid; background: var(--line); gap: 6px; border-radius: 10px; overflow: hidden; }
  .big #board { gap: 1px; border-radius: 6px; }
  .cell {
    aspect-ratio: 1; min-width: 0; padding: 0; border: 0; background: var(--cell);
    cursor: pointer; display: grid; place-items: center; touch-action: manipulation;
  }
  #board[data-n="3"] .cell { border-radius: 14px; }
  .cell.last { background: #fff3c4; }
  .cell.win { background: #ffe28a; }
  .cell.win svg { animation: bounce 0.6s ease-in-out infinite alternate; }
  @media (hover: hover) { .cell:not(.filled):not(:disabled):hover { background: #eef6ff; } }
  .cell svg { width: 86%; height: 86%; pointer-events: none; }
  .mark.pop { animation: pop 0.32s cubic-bezier(.3, 1.8, .5, 1); }
  @keyframes pop { from { transform: scale(0.2) rotate(-25deg); } to { transform: scale(1) rotate(0); } }
  @keyframes bounce { from { transform: scale(1); } to { transform: scale(1.18); } }
  #wline { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }
  #wline line { stroke-dasharray: 1; stroke-dashoffset: 1; animation: strike 0.5s 0.1s ease-out forwards; }
  @keyframes strike { to { stroke-dashoffset: 0; } }

  #status { margin: 0; text-align: center; font-weight: 800; font-size: 16px; min-height: 24px; }
  .status-pill { display: inline-block; background: var(--paper); border: 2px solid var(--ink); border-radius: 999px; padding: 0 16px; }
  .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

  /* ---------- Overlay / fireworks ---------- */
  #fx { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
  .overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 60;
    display: grid; place-items: center; padding: 16px; background: rgba(43, 42, 76, 0.45);
  }
  .modal {
    background: #fff; border: 4px solid var(--ink); border-radius: 24px; box-shadow: 0 8px 0 var(--ink);
    padding: 20px 18px 18px; width: min(100%, 360px); text-align: center;
    animation: modalIn 0.45s cubic-bezier(.3, 1.6, .5, 1);
  }
  @keyframes modalIn { from { transform: scale(0.5) rotate(-6deg); opacity: 0; } to { transform: none; opacity: 1; } }
  .modal .big-emoji { font-size: 54px; line-height: 1; }
  .modal h2 { margin: 6px 0 4px; font-size: 28px; font-weight: 800; line-height: 1.1; overflow-wrap: anywhere; }
  .modal p { margin: 0 0 14px; font-size: 17px; }
  .modal .btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

  .ver { position: relative; z-index: 1; max-width: 640px; margin: 8px auto 0; text-align: center; }
  .ver span { display: inline-block; background: rgba(255, 255, 255, 0.85); border-radius: 999px; padding: 0 12px; font-size: 13px; font-weight: 700; }
  .btn.lang { font-size: 15px; min-width: 48px; }
  html[lang^="zh"] body { font-family: "Baloo 2", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
  @media (max-width: 400px) {
    .row > span { overflow-wrap: anywhere; }
    .row { grid-template-columns: 62px 1fr; }
    .sticker { font-size: 20px; }
    .btn.icon { min-width: 38px; }
    .tools { gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    #wline line { stroke-dashoffset: 0; }
  }
</style>

<div id="bg" aria-hidden="true"></div>
<main id="app">
  <header class="top">
    <h1 class="sticker">
      <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="#fff" stroke="#2b2a4c" stroke-width="3"/><path d="M11 11L25 25M25 11L11 25" stroke="#ff5a36" stroke-width="5" stroke-linecap="round" transform="translate(2 2) scale(.8)"/><circle cx="26" cy="26" r="5" fill="none" stroke="#1e88ff" stroke-width="3.5"/></svg>
      <span><span data-i18n="title"></span><small data-i18n="subtitle"></small></span>
    </h1>
    <div class="tools">
      <a class="btn icon home" id="homeLink" href="/" hidden data-i18n-aria="homeBtn">🏠</a>
      <button class="btn icon lang" id="btnLang" type="button" aria-label="Language">VI</button>
      <button class="btn icon" id="btnSound" type="button" aria-pressed="true" aria-label="">🔊</button>
      <button class="btn icon" id="btnTheme" type="button" aria-expanded="false" aria-controls="themes" data-i18n-aria="themeBtn">🎨</button>
    </div>
  </header>

  <section id="themes" class="card" hidden data-i18n-aria="themesLabel">
    <div class="row"><span data-i18n="piecesL"></span>
      <div class="seg" data-set="pieces">
        <button type="button" data-v="xo" aria-pressed="false">X · O</button>
        <button type="button" data-v="dots" aria-pressed="false"><i class="d r"></i><i class="d g"></i> <span data-i18n="piecesDots"></span></button>
      </div>
    </div>
    <div class="theme-grid" id="themeGrid"></div>
  </section>

  <section class="card settings" data-i18n-aria="settingsLabel">
    <div class="row"><span data-i18n="kind"></span>
      <div class="seg" data-set="mode">
        <button type="button" data-v="3" aria-pressed="false"><span data-i18n="mode3"></span><small data-i18n="mode3s"></small></button>
        <button type="button" data-v="5" aria-pressed="false"><span data-i18n="mode5"></span><small data-i18n="mode5s"></small></button>
      </div>
    </div>
    <div class="row"><span data-i18n="opp"></span>
      <div class="seg" data-set="opp">
        <button type="button" data-v="pvp" aria-pressed="false"><span data-i18n="pvp"></span><small data-i18n="pvps"></small></button>
        <button type="button" data-v="ai" aria-pressed="false" data-i18n="ai"></button>
      </div>
    </div>
    <div class="row" id="firstRow" hidden><span data-i18n="firstL"></span>
      <div class="seg" data-set="first">
        <button type="button" data-v="human" aria-pressed="false" data-i18n="firstHuman"></button>
        <button type="button" data-v="ai" aria-pressed="false" data-i18n="firstAi"></button>
      </div>
    </div>
    <div class="row" id="levelRow" hidden><span data-i18n="level"></span>
      <div class="seg" data-set="level">
        <button type="button" data-v="easy" aria-pressed="false" data-i18n="easy"></button>
        <button type="button" data-v="hard" aria-pressed="false" data-i18n="hard"></button>
      </div>
    </div>
  </section>

  <section class="players" data-i18n-aria="playersLabel">
    <div class="pcard x" id="cardX">
      <div class="top2">
        <span class="ic" id="icX" aria-hidden="true"></span>
        <span class="score" id="scoreX">0</span>
      </div>
      <input id="nameX" maxlength="12" autocomplete="off" data-i18n-aria="nameXLabel">
    </div>
    <div class="draws"><span><b id="scoreD">0</b><span data-i18n="draws"></span></span></div>
    <div class="pcard o" id="cardO">
      <div class="top2">
        <span class="ic" id="icO" aria-hidden="true"></span>
        <span class="score" id="scoreO">0</span>
      </div>
      <input id="nameO" maxlength="12" autocomplete="off" data-i18n-aria="nameOLabel">
    </div>
  </section>

  <div class="board-wrap" id="boardWrap">
    <div class="gridbox">
      <div id="board" role="grid" data-i18n-aria="boardLabel"></div>
      <svg id="wline" aria-hidden="true"></svg>
    </div>
  </div>

  <p id="status" aria-live="polite"></p>

  <div class="actions">
    <button class="btn primary" id="btnNew" type="button" data-i18n="newGame"></button>
    <button class="btn blue" id="btnUndo" type="button" data-i18n="undo"></button>
  </div>
</main>
<footer class="ver"><span id="ver"></span></footer>

<canvas id="fx" hidden></canvas>

<div id="modal" class="overlay" hidden role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="modal">
    <div class="big-emoji" id="mEmoji">🎉</div>
    <h2 id="mTitle"></h2>
    <p id="mText"></p>
    <div class="btns">
      <button class="btn primary" id="mNext" type="button" data-i18n="mNext"></button>
      <button class="btn" id="mClose" type="button" data-i18n="mClose"></button>
    </div>
  </div>
</div>

    THEMES.forEach((th) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'thumb'; b.dataset.t = th.id;
      b.innerHTML = `<span class="em">${th.em[0]}${th.em[1]}</span><span class="nm" data-i18n="th_${th.id}"></span>`;
      b.addEventListener('click', () => { state.theme = th.id; applyTheme(); save(); updateUI(); toggleThemes(false); });
      grid.appendChild(b);
    });
  }
  function applyTheme() {
    const t = THEMES.find((x) => x.id === state.theme) || THEMES[0];
    const bg = $('#bg');
    bg.dataset.t = t.id;
    document.body.style.background = '#ffe9b8';
    bg.textContent = '';
    const total = 10;
    for (let i = 0; i < total; i++) {
      const s = document.createElement('span');
      s.className = 'floater';
      s.textContent = t.em[i % t.em.length];
      s.style.left = ((i * 37 + 8) % 92) + '%';
      s.style.top = ((i * 53 + 5) % 88) + '%';
      s.style.fontSize = (26 + ((i * 11) % 30)) + 'px';
      s.style.animationDuration = (9 + (i % 5) * 2.2) + 's';
      s.style.animationDelay = (-i * 1.3) + 's';
      bg.appendChild(s);
    }
  }
  function toggleThemes(show) {
    const el = $('#themes');
    const v = typeof show === 'boolean' ? show : el.hidden;
    el.hidden = !v;
    $('#btnTheme').setAttribute('aria-expanded', String(v));
  }

  /* ================= Game flow ================= */
  function clearTimers() {
    clearTimeout(aiTimer); clearTimeout(resultTimer); aiBusy = false;
  }
  const startTurn = () => (state.opp === 'ai' && state.first === 'ai' ? 'O' : 'X'); // human is always X, computer always O
  const canUndo = () => state.history.length > 0 && (state.opp !== 'ai' || state.history.some((m) => m.p === 'X'));
  function newGame() {
    clearTimers(); fxStop(); closeModal();
    setSize();
    Object.assign(state, { board: new Array(state.size * state.size).fill(null), turn: startTurn(), over: false, winner: null, winCells: [], history: [], last: null });
    prevLast = null;
    buildBoard(); renderAll(); updateUI();
    maybeAI(); // computer opens when it goes first
  }
  function play(r, c) {
    const n = state.size, i = r * n + c;
    if (state.over || !inb(n, r, c) || state.board[i]) return false;
    const p = state.turn;
    const old = state.last;
    state.board[i] = p; state.history.push({ r, c, p }); state.last = i;
    sfxPop(p);
    const w = checkWin(state.board, n, state.win, r, c);
    if (w) { state.over = true; state.winner = p; state.winCells = w; state.score[p]++; }
    else if (state.board.every(Boolean)) { state.over = true; state.winner = null; state.score.D++; }
    else state.turn = other(p);
    if (old !== null) renderCell(old, false);
    renderCell(i, true);
    if (state.over) { drawWinLine(); state.winCells.forEach(([rr, cc]) => renderCell(rr * n + cc, false)); scheduleResult(); }
    updateUI(); save();
    if (!state.over) maybeAI();
    return true;
  }
  function maybeAI() {
    if (state.opp !== 'ai' || state.over || state.turn !== 'O') return;
    aiBusy = true; updateUI();
    clearTimeout(aiTimer);
    aiTimer = setTimeout(() => {
      aiBusy = false;
      if (state.over || state.turn !== 'O') { updateUI(); return; }
      const i = aiPick(state.board, state.size, 'O', 'X', state.level, state.win);
      play(Math.floor(i / state.size), i % state.size);
    }, 400);
  }
  function undo() {
    if (!canUndo()) return; // never remove the computer's opening move
    clearTimers(); fxStop(); closeModal();
    if (state.over) { if (state.winner) state.score[state.winner] = Math.max(0, state.score[state.winner] - 1); else state.score.D = Math.max(0, state.score.D - 1); }
    state.over = false; state.winner = null; state.winCells = [];
    let popped;
    do {
      popped = state.history.pop();
      state.board[popped.r * state.size + popped.c] = null;
    } while (state.opp === 'ai' && popped.p !== 'X' && state.history.length);
    state.turn = popped.p;
    const h = state.history[state.history.length - 1];
    state.last = h ? h.r * state.size + h.c : null;
    renderAll(); updateUI(); save();
    if (state.opp === 'ai' && state.turn === 'O') maybeAI();
  }

  /* ================= Result popup ================= */
  let lastFocus = null;
  function scheduleResult() {
    clearTimeout(resultTimer);
    resultTimer = setTimeout(showResult, 650);
  }
  function fillModal() {
    const w = state.winner;
    let emoji, title, text;
    if (!w) { emoji = '🤝'; title = t('mDrawT'); text = t('mDrawX'); }
    else if (state.opp === 'ai' && w === 'O') { emoji = '🤖'; title = t('mLoseT'); text = t('mLoseX'); }
    else { emoji = '🎉'; title = t('mWinT', { name: displayName(w) }); text = t('mWinX'); }
    $('#mEmoji').textContent = emoji;
    $('#mTitle').textContent = title;
    $('#mText').textContent = text;
  }
  function showResult() {
    const w = state.winner;
    if (!w) sfxDraw();
    else if (state.opp === 'ai' && w === 'O') sfxCheer();
    else { fxStart(); sfxVictory(); }
    fillModal();
    lastFocus = document.activeElement;
    $('#modal').hidden = false;
    $('#mNext').focus();
  }
  function closeModal() {
    if ($('#modal').hidden) return;
    $('#modal').hidden = true;
    if (lastFocus && lastFocus.focus) { try { lastFocus.focus(); } catch (e) {} }
  }

  /* ================= Language ================= */
  function applyLang() {
    document.documentElement.lang = HTML_LANG[lang];
    document.title = t('docTitle');
    document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll('[data-i18n-aria]').forEach((el) => { el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
    document.querySelectorAll('.thumb').forEach((b) => b.setAttribute('aria-label', t('themeName', { name: t('th_' + b.dataset.t) })));
    const lb = $('#btnLang');
    lb.textContent = t('langShort'); lb.setAttribute('aria-label', t('langLabel'));
    $('#ver').textContent = 'Father_AI · v' + APP_VERSION; // same in every language, not translated
    if (builtSize) renderAll();
    updateUI();
    if (!$('#modal').hidden) fillModal();
  }
  function setLang(code) {
    if (!LANGS.includes(code)) return;
    lang = code; applyLang(); save();
  }

  /* ================= Events ================= */
  // Changing piece style keeps the running game: just redraw
  function setPieces(v) {
    if (v !== 'xo' && v !== 'dots') return;
    state.pieces = v; save(); renderAll(); updateUI();
    if (!$('#modal').hidden) fillModal();
  }
  function setFirst(v) { if (v === 'human' || v === 'ai') setOpt('first', v); }
  function setOpt(key, v) {
    if (state[key] === v) return;
    state[key] = v;
    newGame(); save();
  }
  function wire() {
    document.querySelectorAll('.seg button').forEach((b) =>
      b.addEventListener('click', () => { const k = b.parentElement.dataset.set; if (k === 'pieces') setPieces(b.dataset.v); else setOpt(k, b.dataset.v); }));
    boardEl.addEventListener('click', (e) => {
      const b = e.target.closest('.cell'); if (!b) return;
      if (aiBusy || (state.opp === 'ai' && state.turn === 'O')) return;
      const i = Number(b.dataset.i);
      play(Math.floor(i / state.size), i % state.size);
    });
    $('#btnNew').addEventListener('click', () => { newGame(); });
    $('#btnUndo').addEventListener('click', undo);
    $('#btnSound').addEventListener('click', () => { state.sound = !state.sound; if (state.sound) audio(); save(); updateUI(); });
    $('#btnLang').addEventListener('click', () => setLang(LANGS[(LANGS.indexOf(lang) + 1) % LANGS.length]));
    $('#btnTheme').addEventListener('click', () => toggleThemes());
    $('#mNext').addEventListener('click', () => { newGame(); });
    $('#mClose').addEventListener('click', () => { fxStop(); closeModal(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#modal').hidden) { fxStop(); closeModal(); } });
    [['X', '#nameX'], ['O', '#nameO']].forEach(([p, sel]) => {
      const inp = $(sel);
      inp.addEventListener('input', () => { if (state.opp === 'ai' && p === 'O') return; state.names[p] = inp.value === defName(p) ? '' : inp.value.slice(0, 12); save(); updateUI(); });
      inp.addEventListener('blur', () => { if (!state.names[p].trim()) { state.names[p] = ''; } updateUI(); save(); });
    });
  }

  /* ================= Start / hot reload ================= */
  function start(data) {
    try { applyPrefs(JSON.parse(localStorage.getItem(KEY) || 'null')); } catch (e) {}
    data = data || {};
    if (data.prefs) applyPrefs(data.prefs);
    setSize();
    state.board = new Array(state.size * state.size).fill(null);
    state.turn = startTurn();
    if (Array.isArray(data.board) && data.board.length === state.size * state.size && data.mode === state.mode) {
      state.board = data.board; state.turn = data.turn === 'O' ? 'O' : 'X';
      state.over = !!data.over; state.winner = data.winner || null;
      state.winCells = Array.isArray(data.winCells) ? data.winCells : [];
      state.history = Array.isArray(data.history) ? data.history : [];
      state.last = Number.isInteger(data.last) ? data.last : null;
    }
    buildThemes(); applyTheme(); wire();
    buildBoard(); renderAll(); applyLang();
    maybeAI();
  }
  try {
    window.claude?.hot?.snapshot(() => ({
      prefs: prefs(), mode: state.mode, board: state.board, turn: state.turn, over: state.over,
      winner: state.winner, winCells: state.winCells, history: state.history, last: state.last,
    }));
  } catch (e) {}
  // Test hooks: pure logic plus a direct move helper
  // Test helper: switch mode (3 = 3x3 / 3-in-a-row, 15 = 15x15 / 5-in-a-row)
  function setBoard(n) {
    n = Number(n);
    if (n === 15) state.mode = '5'; else if (n === 3) state.mode = '3'; else return;
    newGame(); save();
  }
  window.__caro = { setBoard, setFirst, setPieces, aiHeur, state, checkWin, play, aiPick, newGame, undo, setLang };
  try {
    window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
  } catch (e) { start({}); }
})();
</script>
